[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smplcache"
version = "0.1.0"
description = "A boundary-tested diagnostic cache engine for relational workloads."
readme = "README.md"
authors = [
    { name = "Jeremy Carroll" }
]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Database",
]
requires-python = ">=3.10"
dependencies = [
    "sqlglot>=20.0",
]

[project.scripts]
smplcache = "smplcache.cli:main"

[project.urls]
"Homepage" = "https://github.com/dbccpage/smplcache"
"Bug Tracker" = "https://github.com/dbccpage/smplcache/issues"

[project.optional-dependencies]
numpy = [
    "numpy>=1.24",
]
matrix = [
    "numpy>=1.24",
]
demo = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]
duckdb = [
    "duckdb>=0.10.0",
]
live = [
    "psycopg[binary]>=3.1.0",
    "pymssql>=2.2.0",
    "pymongo>=4.6.0",
]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "black",
    "mypy",
    "numpy>=1.24",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["smplcache", "smplcache.*"]

[tool.pytest.ini_options]
testpaths = ["tests", "demo/tests"]

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "psycopg", "psycopg.*", "pymssql", "pymssql.*", "pymongo", "pymongo.*"]
ignore_missing_imports = true

