name: SmplCache CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,demo,numpy]"

    - name: Check code formatting
      run: |
        black --check .

    - name: Check package types
      run: python -m mypy smplcache demo

    - name: Test with pytest
      run: |
        python -m pytest

    - name: Clean venv install and CLI smoke test
      run: |
        python -m venv /tmp/smoke_venv
        /tmp/smoke_venv/bin/pip install .
        /tmp/smoke_venv/bin/smplcache report examples/workload.common.json
